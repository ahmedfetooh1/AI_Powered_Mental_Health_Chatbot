<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Mental Health Chatbot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap');

        :root {
            --primary-color: #1c2136; 
            --primary-gradient: linear-gradient(135deg, #1c2136 0%, #764ba2 100%);
            --secondary-color: #764ba2; 
            --bg-color: #f5f5f5;
            --text-color: #333333;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .switch-form {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .switch-form a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .switch-form a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-card">
        <h2 id="form-title">Welcome Back</h2>
        
        {% if error %}
        <p style="color: red; font-size: 0.9rem; margin-bottom: 1rem;">{{ error }}</p>
        {% endif %}
        
        <!-- Login Form -->
        <form id="login-form" action="/login" method="POST">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <!-- Sign-up Form (Hidden by default) -->
        <form id="signup-form" action="/signup" method="POST" style="display: none;">
            <div class="form-group">
                <label for="signup-username">Username</label>
                <input type="text" id="signup-username" name="username" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" name="password" required placeholder="Choose a password">
            </div>
            <div class="form-group">
                <label for="signup-confirm-password">Confirm Password</label>
                <input type="password" id="signup-confirm-password" name="confirm_password" required placeholder="Confirm your password">
            </div>
            <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <div class="switch-form" id="switch-text">
            Don't have an account? <a href="#" onclick="toggleForm(event)">Sign up</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const formTitle = document.getElementById('form-title');
        const switchTextDiv = document.getElementById('switch-text');

        let isLogin = true;

        // Clean toggle logic
        function toggleForm(e) {
            if (e) e.preventDefault();
            isLogin = !isLogin;
            
            if (isLogin) {
                formTitle.innerText = "Welcome Back";
                loginForm.style.display = "block";
                signupForm.style.display = "none";
                switchTextDiv.innerHTML = `Don't have an account? <a href="#" onclick="toggleForm(event)">Sign up</a>`;
            } else {
                formTitle.innerText = "Create an Account";
                loginForm.style.display = "none";
                signupForm.style.display = "block";
                switchTextDiv.innerHTML = `Already have an account? <a href="#" onclick="toggleForm(event)">Log in</a>`;
            }
        }

        // Save username to localStorage before submitting to backend so chat.html can authenticate
        loginForm.addEventListener('submit', () => {
            const email = document.getElementById('login-email').value;
            localStorage.setItem('chat_username', email.split('@')[0]);
        });

        signupForm.addEventListener('submit', () => {
            const username = document.getElementById('signup-username').value;
            localStorage.setItem('chat_username', username);
        });
    </script>
</body>
</html>
